<!DOCTYPE html>
<html>
<head>
  <title>Illia's Page</title>

  <style>
    body {
      background-color: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 150px;
    }

    .card {
      background-color: #1e293b;
      width: 500px;
      margin: auto;
      padding: 40px;
      border-radius: 20px;
    }

    button {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Hi, I'm Illia 👋</h1>

    <p>I'm a Psychology student at the University of Alberta.</p>

    <p>I enjoy travelling, working out, and learning new things.</p>

    <button onclick="showFact()">Click for a fact about me</button>

    <p id="fact"></p>
  </div>

  <script>
    function showFact() {
      document.getElementById("fact").innerHTML =
        "One of my goals is to travel and experience more of the world 🌎";
    }
  </script>

</body>
</html>
