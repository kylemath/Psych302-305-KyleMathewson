<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0b0f14;
      color: #000000;
    }
    .card {
      background: #d96c9d;
      padding: 28px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
    }
    button {
      background: #e8b86d;
      color: #1c1408;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, my name is Melody</h1>
    <p>I really love the color Pink.
</p>
    <p id="detail">I'm a 4th year psych major.</p>
    <button id="more">I love afrobeats!</button>
  </div>
  <script>
    const button = document.getElementById("more");
    button.addEventListener("click", () => {
      document.getElementById("detail").textContent =
        "My favorite artist is Asake :)";
      button.textContent = "Thanks";
    });
  </script>
</body>
</html>
