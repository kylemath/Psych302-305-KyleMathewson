<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: 'Georgia', serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0d3b4f;
      color: #2c2418;
      overflow: hidden;
    }
    .card {
      border: 3px solid transparent;
      background-image: linear-gradient(#f0e4d3, #f0e4d3),
                         linear-gradient(60deg, #e8791a, #f5a623, #1a8f7a);
      background-origin: border-box;
      background-clip: padding-box, border-box;
      background-size: 100%, 300% 300%;
      animation: borderMove 4s linear infinite;
      padding: 28px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
      position: relative;
      z-index: 2;
      min-height: 260px;
    }
    @keyframes borderMove {
      0% { background-position: 0%, 0% 0%; }
      100% { background-position: 0%, 300% 300%; }
    }
    button {
      background: #e8791a;
      color: #f0e4d3;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      position: relative;
      transition: left 0.2s ease, top 0.2s ease;
      font-family: 'Georgia', serif;
    }
    #reset {
      background: #0d3b4f;
      color: #f0e4d3;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 12px;
      display: none;
      font-family: 'Georgia', serif;
    }
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas"></canvas>
  <div class="card" id="card">
    <h1>Hello, I am Mariana :)</h1>
    <p>I am a 4th year Psych major</p>
    <p id="detail">This is my first time coding.... wuuu hoo!</p>
    <button id="more">TRY to click for a third fact</button>
    <br>
    <button id="reset">↺ Try again</button>
  </div>
  <script>
    const button = document.getElementById("more");
    const resetBtn = document.getElementById("reset");
    const card = document.getElementById("card");
    const detail = document.getElementById("detail");
    let caught = false;

  const revealText = "I love cats, going to coffee shops and discovering new music :)";
const originalText = "This is my first time coding.... wuuu hoo!";

    function moveButton() {
      if (caught) return;
      const cardRect = card.getBoundingClientRect();
      const btnRect = button.getBoundingClientRect();

      const maxX = cardRect.width - btnRect.width - 20;
      const maxY = cardRect.height - btnRect.height - 20;

      const randomX = Math.random() * Math.max(maxX, 10);
      const randomY = Math.random() * Math.max(maxY, 10);

      button.style.position = "absolute";
      button.style.left = randomX + "px";
      button.style.top = randomY + "px";
    }

    button.addEventListener("mouseover", moveButton);
    button.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveButton();
    });

    button.addEventListener("click", () => {
      caught = true;
      button.style.position = "relative";
      button.style.left = "auto";
      button.style.top = "auto";
      detail.textContent = revealText;
      button.textContent = "You did it!";
      resetBtn.style.display = "inline-block";
      launchConfetti();
    });

    resetBtn.addEventListener("click", () => {
      caught = false;
      detail.textContent = originalText;
      button.textContent = " TRY to click for a third fact";
      resetBtn.style.display = "none";
    });

    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    window.addEventListener("resize", () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    const colors = ["#e8791a", "#f5a623", "#1a8f7a", "#f0e4d3"];

    function launchConfetti() {
      const particles = [];
      for (let i = 0; i < 150; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          angle: Math.random() * Math.PI * 2,
          speed: Math.random() * 8 + 4,
          size: Math.random() * 6 + 4,
          color: colors[Math.floor(Math.random() * colors.length)],
          gravity: 0.15,
          life: 100
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let alive = false;

        particles.forEach(p => {
          if (p.life > 0) {
            alive = true;
            p.x += Math.cos(p.angle) * p.speed;
            p.y += Math.sin(p.angle) * p.speed + p.gravity * (100 - p.life) * 0.1;
            p.life -= 1.5;

            ctx.globalAlpha = Math.max(p.life / 100, 0);
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, p.size, p.size);
          }
        });

        ctx.globalAlpha = 1;

        if (alive) {
          requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      animate();
    }
  </script>
</body>
</html>
