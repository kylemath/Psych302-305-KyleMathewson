<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #3590ff;
      color: #000000;
    }
    .card {
      background: #ffffff;
      padding: 28px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
    }
    #fireworks {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .card {
      position: relative;
      z-index: 1;
    }
    button {
      background: #3590ff;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="fireworks"></canvas>

  <div class="card">
    <h1>Hello, I am Arshdeep Bajaj</h1>
    <p>I’ve lost a lot of weight and completely changed my approach to fitness.</p>
    <p id="detail">I’ve worked on everything from smart-home systems and static analysis to chatbots and cybersecurity projects. I genuinely enjoy figuring out how complicated systems work.</p>
    <button id="more">Click to see fireworks.</button>
  </div>

  <script>
    const button = document.getElementById("more");
    const canvas = document.getElementById("fireworks");
    const ctx = canvas.getContext("2d");

    // Warm colours, so they read against the blue background.
    const COLORS = ["#ffd166", "#ff6b6b", "#ff8ae2", "#fff3b0", "#ffffff", "#ffa64d"];
    let rockets = [];
    let sparks = [];
    let running = false;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener("resize", resize);

    function launch() {
      const color = COLORS[Math.floor(Math.random() * COLORS.length)];
      rockets.push({
        x: canvas.width * (0.2 + Math.random() * 0.6),
        y: canvas.height,
        vx: (Math.random() - 0.5) * 1.6,
        vy: -(canvas.height / 62) - Math.random() * 3,
        burstAt: canvas.height * (0.18 + Math.random() * 0.28),
        color: color
      });
    }

    function burst(x, y, color) {
      const count = 70 + Math.floor(Math.random() * 40);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5.5 + 1;
        sparks.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 1,
          decay: 0.008 + Math.random() * 0.012,
          color: color
        });
      }
    }

    function frame() {
      // Translucent fill instead of clearing, so everything leaves a trail.
      // This colour must match the page background.
      ctx.fillStyle = "rgba(53, 144, 255, 0.22)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      rockets = rockets.filter((r) => {
        r.x += r.vx;
        r.y += r.vy;
        r.vy += 0.12;
        ctx.fillStyle = r.color;
        ctx.fillRect(r.x, r.y, 2.5, 3.5);
        if (r.vy >= 0 || r.y <= r.burstAt) {
          burst(r.x, r.y, r.color);
          return false;
        }
        return true;
      });

      sparks = sparks.filter((sp) => {
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.vx *= 0.985;
        sp.vy = sp.vy * 0.985 + 0.055;
        sp.life -= sp.decay;
        if (sp.life <= 0) return false;
        ctx.globalAlpha = Math.max(sp.life, 0);
        ctx.fillStyle = sp.color;
        ctx.fillRect(sp.x, sp.y, 2.5, 2.5);
        ctx.globalAlpha = 1;
        return true;
      });

      if (running || rockets.length || sparks.length) {
        requestAnimationFrame(frame);
      }
    }

    button.addEventListener("click", () => {
      if (running) return;
      running = true;
      button.textContent = "Enjoy";

      launch();
      const timer = setInterval(launch, 380);
      frame();

      setTimeout(() => {
        clearInterval(timer);
        running = false;
      }, 4200);
    });
  </script>
</body>
</html>
