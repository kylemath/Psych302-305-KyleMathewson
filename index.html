<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f7c6d8;
      color: #4a1a2c;
    }
    .card {
      background: #fff7f4;
      padding: 28px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
      border: 3px solid #c2185b;
    }
    button {
      background: #c2185b;
      color: #fff7f4;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, I am Seeratpreet Kaur</h1>
    <p>I am a fourth-year student, double majoring in Computing Science and Psychology.</p>
    <p id="detail">My favourite Starbucks order is a secret until you click.</p>
    <button id="more">Reveal my order</button>
  </div>
  <script>
    const button = document.getElementById("more");
    button.addEventListener("click", () => {
      document.getElementById("detail").textContent =
        "A Pink Drink with vanilla sweet cream cold foam.";
      button.textContent = "That's the one";
    });
  </script>
</body>
</html>
