<!DOCTYPE html>
<html>
<head>
  <style>

    body {
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #07111f, #102a43, #1f3b5b);
      color: #f6f1e6;
      overflow: hidden;
    }

    .card {
      background: #1a2230;
      padding: 28px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
    }

    button {
      background: #e8b86d;
      color: #1c1408;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

  </style>
</head>

<body>

  <div class="card">

    <h1>Hello, I am Abdiaziz</h1>

    <p>I am a 3rd year student majoring in Psych</p>

    <p id="detail">
      Computationally illiterate, but learning through it
    </p>

    <button id="more">
      Click for a third fact
    </button>

  </div>

  <script>

    const button = document.getElementById("more");

    button.addEventListener("click", () => {

      document.getElementById("detail").textContent =
        "I have mastered the art of looking busy";

      button.textContent = "🎉 that's all! 🎉";

      for (let i = 0; i < 150; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left =
          Math.random() * 100 + "vw";

        confetti.style.backgroundColor =
          `hsl(${Math.random() * 360}, 100%, 50%)`;

        confetti.style.animationDelay =
          Math.random() * 1 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 4000);

      }

    });

  </script>

</body>
</html>
