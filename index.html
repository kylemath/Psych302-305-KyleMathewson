 <!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0EEDC8;
      color: #1D4040;
    }
    .card {
      background: #f6f1e6;
      padding: 60px 70px;
      border-radius: 35%;
      text-align: center;
      max-width: 340px;
    }
    button {
      background: #5E2929;
      color: #f6f1e6;
      border: none;
      padding: 20px 23px;
      border-radius: 20px 35px 20px 35px;
      font-weight: bold;
      cursor: wait;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hi everyone, this is Sally ♥</h1>
    <p>⭐I am a rookie at computers, I even forgot how to use google colab.</p >
    <p id="detail">⭐I really like mint chocolate💚🍫 , that's why my background color is mint-toned.</p >
    <button id="more">Click for a third fact</button>
  </div>
  <script>
    const button = document.getElementById("more");
    button.addEventListener("click", () => {
      document.getElementById("detail").textContent =
        "⭐I firmly believe weekends are never long enough.";
      button.textContent = "Thanks";
    });
  </script>
</body>
</html>
