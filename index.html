<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: "Comic Sans MS", cursive;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f8c8d4;
      color: white;
    }
    .card {
      background: #d96c8a;
      padding: 28px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
    }
    button {
      background: #f4a6b7;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, I am Ruzbah</h1>
    <p>Currently fourth year Psychology student.</p>
    <p id="detail">Graduating on June 2027.</p>
    <button id="more">Click for a third fact</button>
  </div>
  <script>
    const button = document.getElementById("more");
    button.addEventListener("click", () => {
      document.getElementById("detail").textContent =
        "I love learning new languages.";
      button.textContent = "Thanks";
    });
  </script>
</body>
</html>
