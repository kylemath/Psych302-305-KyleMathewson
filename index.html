<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Ravie, serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #19571C;
      color: #38A26A;
    }
    .card {
      background: #3B721B;
      padding: 28px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
    }
    button {
      background: #e8b86d;
      color: #1c1408;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Howdy! I am Chey:</h1>
    <p>I love the colour green.</p>
    <p id="detail">I love mushrooms</p>
    <p id="detail">I love Halloween</p>
<img src="https://png.pngtree.com/png-vector/20260428/ourmid/pngtree-cute-mushroom-wizard-fantasy-cottage-t-shirt-vector-design-png-image_19191874.webp" alt="https://png.pngtree.com/png-vector/20260428/ourmid/pngtree-cute-mushroom-wizard-fantasy-cottage-t-shirt-vector-design-png-image_19191874.webp" class="transparent shrinkToFit" width="331" height="331">
    <button id="more">I have lied once, which is it?</button>
  </div>
  <script>
    const button = document.getElementById("more");
    button.addEventListener("click", () => {
      document.getElementById("detail").textContent =
        "I love mushrooms.";
      button.textContent = "This button is the lie! I love all of these things. GOTCHYA";
    });
  </script>
</body>
</html>
