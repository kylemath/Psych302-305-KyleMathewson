<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0b0f0c;
      color: #f3ead7;
    }
    .card {
      background: #17351f;
      padding: 28px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
    }
    button {
      background: #f3ead7;
      color: #17351f;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello, I'm the one and only Nathan W</h1>
    <p>I love hiking and mountain biking.</p>
    <p id="detail">Every morning I drink 3 cups of coffee.</p>
    <button id="more">Wanna know more? Click me ( ͡° ͜ʖ ͡°)</button>
  </div>
  <script>
    const button = document.getElementById("more");
    button.addEventListener("click", () => {
      document.getElementById("detail").textContent =
        "In 2027 I will be attempting 2 Ironman 70.3 races.";
      button.textContent = "That's a wrap (͠≖ ͜ʖ͠≖)";
    });
  </script>
</body>
</html>
