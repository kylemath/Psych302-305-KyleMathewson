<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Isaac</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, 'Times New Roman', serif;
    color: #f5f1e6;
    text-align: center;
    overflow-x: hidden;
    position: relative;
  }
  .bgLayer {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    transition: opacity 3s ease;
  }
  #bgA { opacity: 1; }
  #bgB { opacity: 0; }

  #rain { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .drop {
    position: absolute;
    width: 2px;
    height: 14px;
    border-radius: 2px;
    opacity: 0.85;
  }
  .ripple {
    position: absolute;
    width: 6px;
    height: 6px;
    margin-left: -3px;
    margin-top: -3px;
    border: 1px solid rgba(230,240,225,0.8);
    border-radius: 50%;
    opacity: 0.6;
    transform: scale(1);
    transition: transform 1.6s ease-out, opacity 1.6s ease-out;
  }
  .ripple.expand { transform: scale(14); opacity: 0; }

  .dab {
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    transform: scale(0);
    filter: blur(1px);
    opacity: 0.85;
    z-index: 2;
    transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.3, 1), opacity 1.8s ease;
  }
  .dab.grown { transform: scale(1); }
  .dab.fade { opacity: 0; }

  .content { position: relative; z-index: 3; }
  h1 {
    padding-top: 70px;
    font-size: 3rem;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
    text-shadow: 0 2px 14px rgba(0,0,0,0.55);
  }
  p.tag {
    max-width: 460px;
    margin: 0 auto;
    color: #f5f1e6;
    opacity: 0.95;
    font-size: 1.05rem;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }
  p.hint {
    margin-top: 34px;
    font-style: italic;
    color: #f0ece0;
    opacity: 0.85;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }
  #moodLabel {
    position: fixed;
    top: 18px;
    right: 24px;
    z-index: 3;
    font-style: italic;
    font-size: 0.85rem;
    color: #f5f1e6;
    opacity: 0.9;
    transition: opacity 0.6s ease;
    pointer-events: none;
    text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  }
  #count {
    margin-top: 6px;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    color: #f0ece0;
    opacity: 0.85;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
  button#clear {
    margin-top: 26px;
    background: rgba(20,20,20,0.35);
    border: 1px solid rgba(245,241,230,0.6);
    color: #f5f1e6;
    padding: 8px 18px;
    border-radius: 30px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
    backdrop-filter: blur(2px);
  }
  button#clear:hover { background: rgba(20,20,20,0.55); }
</style>
</head>

        overlay: 'linear-gradient(180deg, rgba(20,18,14,0.5) 0%, rgba(20,18,14,0.15) 35%, rgba(20,18,14,0.55) 100%)',
        drop: 'rgba(255,255,255,0.85)',
        ripple: 'rgba(240,235,220,0.75)'
      }
    ];

    let moodIndex = 0;
    let activeIsA = true;
    const bgA = document.getElementById('bgA');
    const bgB = document.getElementById('bgB');
    const moodLabel = document.getElementById('moodLabel');
    const rainLayer = document.getElementById('rain');
    const waterLine = 58; // vh

    function applyMood(idx, layerEl) {
      layerEl.style.backgroundImage = moods[idx].overlay + ', url("' + moods[idx].img + '")';
    }
    applyMood(0, bgA);

    function cycleMood() {
      moodIndex = (moodIndex + 1) % moods.length;
      const nextLayer = activeIsA ? bgB : bgA;
      const currLayer = activeIsA ? bgA : bgB;
      applyMood(moodIndex, nextLayer);
      nextLayer.style.opacity = '1';
      currLayer.style.opacity = '0';
      activeIsA = !activeIsA;

      moodLabel.style.opacity = '0';
      setTimeout(function () {
        moodLabel.textContent = moods[moodIndex].name;
        moodLabel.style.opacity = '0.9';
      }, 600);
    }
    setInterval(cycleMood, 9000);

    function spawnRipple(xVw, yVh) {
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      ripple.style.left = xVw + 'vw';
      ripple.style.top = yVh + 'vh';
      ripple.style.borderColor = moods[moodIndex].ripple;
      rainLayer.appendChild(ripple);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { ripple.classList.add('expand'); });
      });
      setTimeout(function () { ripple.remove(); }, 1700);
    }

    function spawnRain() {
      const drop = document.createElement('div');
      drop.className = 'drop';
      const x = Math.random() * 100;
      drop.style.left = x + 'vw';
      drop.style.top = '-3vh';
      drop.style.background = 'linear-gradient(to bottom, rgba(255,255,255,0), ' + moods[moodIndex].drop + ')';
      const duration = 1.1 + Math.random() * 0.6;
      drop.style.transition = 'top ' + duration + 's linear, opacity ' + duration + 's linear';
      rainLayer.appendChild(drop);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          drop.style.top = waterLine + 'vh';
          drop.style.opacity = '0.2';
        });
      });
      setTimeout(function () {
        spawnRipple(x, waterLine);
        drop.remove();
      }, duration * 1000);
    }
    setInterval(spawnRain, 260);

    const palette = ['#e8b4c4', '#f2ede0', '#7fa8c9', '#5c7a52', '#d9a441', '#3f6b5d', '#c9d8c0'];
    let total = 0;
    const countEl = document.getElementById('count');

    function paintDab(x, y) {
      const dab = document.createElement('div');
      const size = 24 + Math.random() * 46;
      dab.className = 'dab';
      dab.style.width = size + 'px';
      dab.style.height = size + 'px';
      dab.style.left = (x - size / 2) + 'px';
      dab.style.top = (y - size / 2) + 'px';
      dab.style.background = palette[Math.floor(Math.random() * palette.length)];
      document.body.appendChild(dab);
      requestAnimationFrame(function () { dab.classList.add('grown'); });

      total++;
      countEl.textContent = total + (total === 1 ? ' lily painted' : ' lilies painted');

      setTimeout(function () {
        dab.classList.add('fade');
        setTimeout(function () { dab.remove(); }, 1800);
      }, 6000);
    }

    document.body.addEventListener('click', function (e) {
      if (e.target.id === 'clear') return;
      paintDab(e.clientX, e.clientY);
    });

    document.getElementById('clear').addEventListener('click', function () {
      document.querySelectorAll('.dab').forEach(function (d) { d.remove(); });
    });
  </script>
