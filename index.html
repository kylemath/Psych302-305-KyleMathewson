<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #101C36;
      color: #C9A227;
    }
    .card {
      background: #101C36;
      padding: 28px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
    }
    button {
      background: #e8b86d;
      color: #1c1408;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>My name is Mariam.</h1>
    <p>I can switch between three languages in the same conversation.</p>
    <p id="detail">I dislike coffee, but I love its smell and color.</p>
    <button id="more">Do Not Click</button>
  </div>
  <script>
    const button = document.getElementById("more");
    button.addEventListener("click", () => {
      document.getElementById("detail").textContent =
        "No one I’ve met has ever correctly guessed my family background.";
      button.textContent = "Revealed";
    });
  </script>
</body>
</html>
