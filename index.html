<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: pink;
      color: beige;
    }
    .card {
      background: lightblue;
      padding: 28px 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
    }
    button {
      background: pink;
      color: beige;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hi, my name is Ava! </h1>
<p> I want to share some fun facts about myself! </p>
    <p> I currently work three jobs, my favourite is teaching dance! </p>
    <p id="detail"> I have an eight year old dog named Bella. </p>
    <button id="more">Click here for a third fact</button>
  </div>
  <script>
    const button = document.getElementById("more");
    button.addEventListener("click", () => {
      document.getElementById("detail").textContent =
        "My dog is a sheepadoodle!";
      button.textContent = "She is super cute :)";
    });
  </script>
</body>
</html>
