<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Georgia, serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      background: #07140d;
      color: #eaffea;
    }

    .card {
      background: #10291c;
      padding: 32px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
      border: 2px solid #4caf6a;
      box-shadow: 0 0 30px #1f6b3a;
    }

    h1 {
      color: #7ee787;
    }

    button {
      background: #4caf6a;
      color: #07140d;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #7ee787;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Hey, I'm Luca!</h1>

    <p>I'm a Psychology student at the University of Alberta.</p>

    <p id="detail">
      I enjoy playing video games and Magic: The Gathering.
    </p>

    <button id="more">Learn something else about me</button>
  </div>

  <script>
    const button = document.getElementById("more");

    button.addEventListener("click", () => {
      document.getElementById("detail").textContent =
        "I have a cat and I love animals.";
      button.textContent = "You found it!";
    });
  </script>
</body>
</html>
