<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Say Banana · Misty Jungle</title>
<style>
  :root { --bg:#07110d; --text:#e9f2e4; --accent:#e8c84d; --panel:#0f1f18; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family:system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; }
  h1 { margin:14px 0 2px; letter-spacing:.04em; }
  #rules { margin:0 0 6px; opacity:.8; text-align:center; max-width:760px; }
  #hud { display:flex; gap:24px; font-size:1.15rem; margin:6px 0; }
  #wrap { position:relative; width:min(96vw,880px); }
  canvas#view { width:100%; aspect-ratio:880/520; border-radius:16px; display:block; background:#000; }
  #meter { position:absolute; left:12px; right:12px; bottom:10px; height:14px;
           background:rgba(0,0,0,.45); border-radius:8px; overflow:hidden; }
  #meterFill { height:100%; width:0; background:linear-gradient(90deg,#4caf50,#e8c84d,#e05a3a); }
  #thrLine { position:absolute; top:-3px; bottom:-3px; width:3px; background:#fff; left:40%; }
  #message { min-height:1.6em; margin:8px 0; font-size:1.1rem; text-align:center; }
  #controls { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 18px;
              width:min(96vw,880px); background:var(--panel); padding:12px 16px; border-radius:14px; box-sizing:border-box; }
  #controls label { display:flex; flex-direction:column; font-size:.85rem; gap:2px; }
  #controls input[type=range], #controls select { width:100%; }
  button { font:inherit; padding:10px 18px; margin:4px; border-radius:999px; border:0;
           background:var(--accent); color:#1c1915; cursor:pointer; }
  button.quiet { background:rgba(255,255,255,.15); color:var(--text); }
</style>
</head>
<body>
<h1>🍌 Say Banana</h1>
<p id="rules">Say <b>“BANANA”</b> out loud (above the white line) when a banana appears in the jungle.
Stay <b>silent</b> for a coconut 🥥, between trials, and after the banana is gone.</p>

<div id="hud">
  <span>Score: <b id="score">0</b></span>
  <span>Lives: <b id="lives">3</b></span>
  <span>Level: <b id="level">1</b></span>
</div>

<div id="wrap">
  <canvas id="view" width="880" height="520"></canvas>
  <div id="meter"><div id="meterFill"></div><div id="thrLine"></div></div>
</div>
<div id="message">Press Start and allow the microphone.</div>
<div>
  <button id="startBtn">Start</button>
  <button id="saveBtn" class="quiet">Save my data (CSV)</button>
</div>

<div id="controls">
  <label>Occlusion: <b id="occV">50</b>%
    <input id="occ" type="range" min="0" max="100" value="50"></label>
  <label>Illumination: <b id="illV">45</b>%
    <input id="ill" type="range" min="5" max="100" value="45"></label>
  <label>Target size: <b id="sizeV">100</b>%
    <input id="size" type="range" min="30" max="200" value="100"></label>
  <label>Depth in trees
    <select id="depth">
      <option value="1">1 · shallow (1 layer in front)</option>
      <option value="2" selected>2 · middle (2 layers in front)</option>
      <option value="3">3 · deep (3 layers in front)</option>
      <option value="mix">Mixed (random each trial)</option>
    </select></label>
  <label>Voice volume needed: <b id="thrV">40</b>
    <input id="thr" type="range" min="5" max="95" value="40"></label>
  <label>Coconut chance: <b id="stopV">25</b>%
    <input id="stop" type="range" min="0" max="70" value="25"></label>
</div>

<script>
// =====================================================================
//  SETTINGS (fixed rules; the sliders above change the scene live)
// =====================================================================
const SETTINGS = {
  lives: 3,
  turnsPerLevel: 10,
  startTime: 2200,     // ms target stays on screen at level 1
  speedUp: 0.9,
  fastestTime: 800,
  waitMin: 1200,
  waitMax: 2600,
  lateWindow: 800,     // speech this soon after a missed banana = "too late"
  pointsForBanana: 10,
  pointsForCoconut: 5,
  sound: true,
};

// ---------------------------------------------------------------------
//  Jungle rendering
// ---------------------------------------------------------------------
const W = 880, H = 520, PAD = 120;
const cv = document.getElementById("view");
const ctx = cv.getContext("2d");
const NLAYERS = 4;                // 0 = far background ... 3 = nearest
let layers = [];                  // offscreen canvases
let layerMeta = [];
let scene = { tx: W / 2, ty: H / 2, depth: 2, size: 1, illum: 0.45, occ: 0.5 };
let targetKind = null;            // "go" | "stop" | null
let targetShownAt = 0;
let targetSprite = null;

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (l) => l[Math.floor(Math.random() * l.length)];

function leaf(c, x, y, len, ang, col, rib) {
  c.save(); c.translate(x, y); c.rotate(ang);
  c.fillStyle = col;
  c.beginPath(); c.moveTo(0, 0);
  c.quadraticCurveTo(len * .5, -len * .38, len, 0);
  c.quadraticCurveTo(len * .5, len * .38, 0, 0);
  c.fill();
  c.strokeStyle = rib; c.lineWidth = Math.max(1, len * .03);
  c.beginPath(); c.moveTo(0, 0); c.lineTo(len * .92, 0); c.stroke();
  c.restore();
}
function frond(c, x, y, len, ang, col, rib) {   // palm-like cluster
  const n = 5 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) leaf(c, x, y, len * rnd(.7, 1), ang + (i - n / 2) * rnd(.22, .34), col, rib);
}
function vine(c, x, y, len, col, leafCol) {
  c.strokeStyle = col; c.lineWidth = rnd(2, 5); c.lineCap = "round";
  const sway = rnd(-40, 40);
  c.beginPath(); c.moveTo(x, y);
  c.bezierCurveTo(x + sway, y + len * .3, x - sway, y + len * .65, x + sway * .5, y + len);
  c.stroke();
  for (let k = 0; k < len / 40; k++) {
    const t = k / (len / 40);
    leaf(c, x + sway * .5 * t + rnd(-4, 4), y + len * t, rnd(14, 28), rnd(0, Math.PI * 2), leafCol, col);
  }
}
function shade(i, light) {      // far = bluish + pale, near = dark
  const f = i / (NLAYERS - 1);
  const g = 60 + (1 - f) * 40 + light * 40;
  const r = 20 + (1 - f) * 40 + light * 10;
  const b = 40 + (1 - f) * 55;
  const k = 0.35 + (1 - f) * 0.4;
  return `rgb(${r * k * 1.4 | 0},${g * k * 1.3 | 0},${b * k | 0})`;
}

function makeLayer(i, clumps) {
  const c = document.createElement("canvas");
  c.width = W + PAD * 2; c.height = H + PAD * 2;
  const g = c.getContext("2d");
  const f = i / (NLAYERS - 1);
  const scale = 0.6 + f * 1.1;
  if (i === 0) {   // sky glow / far canopy
    const gr = g.createLinearGradient(0, 0, 0, c.height);
    gr.addColorStop(0, "#27463c"); gr.addColorStop(1, "#0b1a14");
    g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
  }
  // trunks
  const nt = i === 0 ? 14 : 3 + i * 2;
  for (let k = 0; k < nt; k++) {
    const x = rnd(0, c.width), w = rnd(14, 34) * scale;
    g.fillStyle = shade(i, 0);
    g.fillRect(x, 0, w, c.height);
    g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(x + w * .7, 0, w * .3, c.height);
  }
  const col = () => shade(i, Math.random());
  const rib = "rgba(160,210,150,.18)";
  const nf = 22 + i * 10;
  for (let k = 0; k < nf; k++) {
    const x = rnd(0, c.width), y = rnd(0, c.height);
    if (Math.random() < .4) frond(g, x, y, rnd(80, 150) * scale, rnd(0, Math.PI * 2), col(), rib);
    else leaf(g, x, y, rnd(40, 90) * scale, rnd(0, Math.PI * 2), col(), rib);
  }
  for (let k = 0; k < 6 + i * 3; k++) vine(g, rnd(0, c.width), rnd(-20, 160), rnd(150, 420), shade(i, 0), shade(i, .6));
  // occluding clumps near target (and decoys elsewhere)
  for (const cl of clumps) {
    for (let k = 0; k < cl.n; k++) {
      const a = rnd(0, Math.PI * 2), r = Math.sqrt(Math.random()) * cl.r;
      const x = cl.x + PAD + Math.cos(a) * r, y = cl.y + PAD + Math.sin(a) * r;
      if (Math.random() < .35) vine(g, x, y - rnd(40, 100), rnd(100, 200), shade(i, 0), shade(i, .7));
      else leaf(g, x, y, cl.len * rnd(.6, 1.2), rnd(0, Math.PI * 2), col(), rib);
    }
  }
  return c;
}

function pickDepth() {
  const v = document.getElementById("depth").value;
  return v === "mix" ? 1 + Math.floor(Math.random() * 3) : +v;
}

// Build a fresh jungle. Called at the start of every wait so the world keeps changing.
function regenerateJungle() {
  scene.depth = pickDepth();
  scene.size = +document.getElementById("size").value / 100;
  scene.illum = +document.getElementById("ill").value / 100;
  scene.occ = +document.getElementById("occ").value / 100;
  scene.tx = rnd(W * .25, W * .75);
  scene.ty = rnd(H * .35, H * .68);
  const R = 150 * scene.size;
  layers = []; layerMeta = [];
  const front = scene.depth;                  // number of layers in front of target
  for (let i = 0; i < NLAYERS; i++) {
    const inFront = i >= NLAYERS - front;
    const clumps = [];
    if (inFront) {
      const per = Math.round(scene.occ * 26 / front * (0.8 + scene.size * .5));
      clumps.push({ x: scene.tx + rnd(-10, 10), y: scene.ty + rnd(-10, 10), r: R * .75, n: per, len: R * .75 });
    }
    clumps.push({ x: rnd(0, W), y: rnd(0, H), r: 90, n: 8, len: 70 }); // decoy
    layers.push(makeLayer(i, clumps));
    layerMeta.push({ phase: rnd(0, 6.28), freq: rnd(.3, .6) + i * .08, amp: 3 + i * 5, inFront });
  }
  buildTarget();
}

function buildTarget() {
  const s = Math.round(150 * scene.size);
  const c = document.createElement("canvas");
  c.width = c.height = s * 2; targetSprite = c;
}
function paintTarget(kind) {
  const c = targetSprite, g = c.getContext("2d"), s = c.width / 2;
  g.clearRect(0, 0, c.width, c.height);
  g.font = `${s}px serif`; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(kind === "go" ? "🍌" : "🥥", s, s * 1.05);
  // dim it: illumination 100% = full colour, low = nearly black
  g.globalCompositeOperation = "source-atop";
  g.fillStyle = `rgba(4,12,10,${(1 - scene.illum) * 0.92})`;
  g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = "source-over";
}

let mistT = 0;
const mistSprite = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 256;
  const g = c.getContext("2d"), gr = g.createRadialGradient(128, 128, 0, 128, 128, 128);
  gr.addColorStop(0, "rgba(190,225,210,.30)"); gr.addColorStop(1, "rgba(190,225,210,0)");
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256); return c;
})();
function mist(t, seed, alpha) {
  ctx.save(); ctx.globalAlpha = alpha;
  for (let k = 0; k < 4; k++) {
    const x = ((t * (12 + k * 5) + seed * 300 + k * 260) % (W + 500)) - 250;
    const y = H * (.25 + .17 * k) + Math.sin(t * .2 + k + seed) * 30;
    ctx.drawImage(mistSprite, x - 200, y - 130, 560, 320);
  }
  ctx.restore();
}

function render(ts) {
  const t = ts / 1000;
  ctx.clearRect(0, 0, W, H);
  if (!layers.length) regenerateJungle();
  const tIdx = NLAYERS - scene.depth;          // target drawn after layer index tIdx-1... (before first in-front layer)
  for (let i = 0; i < NLAYERS; i++) {
    if (i === tIdx) drawTarget(t);
    const m = layerMeta[i];
    ctx.drawImage(layers[i], -PAD + Math.sin(t * m.freq + m.phase) * m.amp,
                  -PAD + Math.cos(t * m.freq * .7 + m.phase) * m.amp * .4);
    mist(t, i, 0.9 - i * 0.2);                 // mist between layers: deeper = more of it in front
    ctx.fillStyle = `rgba(100,140,125,${0.05})`; ctx.fillRect(0, 0, W, H);
  }
  // vignette
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .65);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.65)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (flashAlpha > 0) { ctx.fillStyle = flashColor.replace("A", flashAlpha.toFixed(2)); ctx.fillRect(0, 0, W, H); flashAlpha -= .03; }
  requestAnimationFrame(render);
}
function drawTarget(t) {
  if (!targetKind) return;
  const fade = Math.min(1, (performance.now() - targetShownAt) / 150);
  const s = targetSprite.width;
  const bob = Math.sin(t * 1.3) * 3;
  ctx.save(); ctx.globalAlpha = fade;
  ctx.drawImage(targetSprite, scene.tx - s / 2, scene.ty - s / 2 + bob);
  ctx.restore();
}
let flashAlpha = 0, flashColor = "rgba(110,231,183,A)";
function flash(good) { flashColor = good ? "rgba(110,231,183,A)" : "rgba(251,80,100,A)"; flashAlpha = .35; }

// ---------------------------------------------------------------------
//  Microphone
// ---------------------------------------------------------------------
let micCtx = null, analyser = null, buf = null, micOn = false;
let level = 0;            // 0..100 loudness
let armed = true;         // must go quiet between voice onsets
let aboveFrames = 0;
let micBlockUntil = 0;    // mic ignored until this time (during our own beeps)
async function startMic() {
  if (micOn) return true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = micCtx.createMediaStreamSource(stream);
    analyser = micCtx.createAnalyser(); analyser.fftSize = 1024;
    buf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
    micOn = true; return true;
  } catch (e) {
    message.textContent = "Microphone unavailable: " + e.message + " (open via http://localhost or https).";
    return false;
  }
}
function readLevel() {
  analyser.getFloatTimeDomainData(buf);
  let s = 0; for (const v of buf) s += v * v;
  const db = 20 * Math.log10(Math.sqrt(s / buf.length) + 1e-9);
  return Math.max(0, Math.min(100, (db + 70) * (100 / 55)));   // -70 dB..-15 dB -> 0..100
}
let peak = 0;
function micLoop() {
  if (micOn) {
    level = readLevel();
    const thr = +thrEl.value;
    meterFill.style.width = level + "%";
    peak = Math.max(peak, level);
    if (performance.now() < micBlockUntil) { aboveFrames = 0; armed = false; peak = 0; }
    else if (level < thr * .6) { armed = true; aboveFrames = 0; }
    else if (level >= thr && armed) {
      if (++aboveFrames >= 2) { armed = false; aboveFrames = 0; onVoice(); }
    }
  }
  requestAnimationFrame(micLoop);
}

// ---------------------------------------------------------------------
//  Game logic
// ---------------------------------------------------------------------
const message = document.getElementById("message");
const thrEl = document.getElementById("thr");
const meterFill = document.getElementById("meterFill");
let data = [], playing = false, turn = 0, score = 0, lives = SETTINGS.lives, lvl = 1;
let current = null, shownAt = 0, timer = null;
let lastMissAt = -1e9;      // when a banana window last expired unanswered

function timeOnScreen() {
  return Math.max(SETTINGS.fastestTime, Math.round(SETTINGS.startTime * Math.pow(SETTINGS.speedUp, lvl - 1)));
}
let audio = null;
function beep(good) {
  if (!SETTINGS.sound) return;
  audio = audio || micCtx || new AudioContext();
  const o = audio.createOscillator(), g = audio.createGain();
  const dur = good ? 0.15 : 0.4;                 // bad = longer, harsher buzz
  const now = audio.currentTime;
  o.type = good ? "sine" : "sawtooth";
  o.frequency.setValueAtTime(good ? 880 : 220, now);
  if (!good) o.frequency.exponentialRampToValueAtTime(110, now + dur);
  g.gain.value = .06;
  o.connect(g).connect(audio.destination); o.start(); o.stop(now + dur);
  // Deaf window: ignore the mic while the beep plays plus room echo/tail,
  // so the game can't hear its own sound.
  micBlockUntil = performance.now() + dur * 1000 + 250;
  armed = false; aboveFrames = 0;
}
function updateHud() {
  document.getElementById("score").textContent = score;
  document.getElementById("lives").textContent = lives;
  document.getElementById("level").textContent = lvl;
}
function logRow(extra) {
  data.push(Object.assign({
    turn, level: lvl, kind: "", depth: scene.depth, occlusion_pct: Math.round(scene.occ * 100),
    illumination_pct: Math.round(scene.illum * 100), size_pct: Math.round(scene.size * 100),
    volume_threshold: +thrEl.value, on_screen_ms: "", spoke: 0, rt_ms: "", peak_level: Math.round(peak),
    outcome: "", correct: 0, score,
  }, extra));
}

async function startGame() {
  if (!(await startMic())) return;
  if (micCtx.state === "suspended") await micCtx.resume();
  clearTimeout(timer);
  data = []; turn = 0; score = 0; lives = SETTINGS.lives; lvl = 1; playing = true;
  current = null; targetKind = null; lastMissAt = -1e9;
  updateHud(); message.textContent = "Get ready... stay quiet until you see a banana.";
  nextTurn();
}
function nextTurn() {
  if (!playing) return;
  targetKind = null; current = null; peak = 0;
  regenerateJungle();
  timer = setTimeout(showThing, rnd(SETTINGS.waitMin, SETTINGS.waitMax));
}
function showThing() {
  turn += 1;
  const isStop = Math.random() < (+document.getElementById("stop").value) / 100;
  current = { kind: isStop ? "stop" : "go", onScreen: timeOnScreen(), depth: scene.depth };
  targetKind = current.kind; paintTarget(targetKind);
  targetShownAt = shownAt = performance.now(); peak = level;
  timer = setTimeout(() => endTurn(false), current.onScreen);
}
function lose(msg, outcome) {
  lives -= 1; message.textContent = msg; beep(false); flash(false);
  logRowIfNeeded(outcome);
  updateHud();
  if (lives <= 0) {
    playing = false; clearTimeout(timer); targetKind = null; current = null;
    message.textContent = `Game over. Score ${score}, level ${lvl}, ${turn} turns. Save your data!`;
    return true;
  }
  return false;
}
function logRowIfNeeded(outcome) {   // errors outside a trial (between / too late)
  logRow({ kind: "none", spoke: 1, outcome, correct: 0 });
}

// Speech detected while the game is running.
function onVoice() {
  if (!playing) return;
  if (current) { endTurn(true); return; }
  // no target on screen: between trials or too late
  const late = performance.now() - lastMissAt < SETTINGS.lateWindow;
  lose(late ? "Too late! The banana was already gone." : "Too early / between trials! Stay quiet.",
       late ? "too_late" : "between_trials");
}

function endTurn(spoke) {
  if (!playing || !current) return;
  clearTimeout(timer);
  const rt = spoke ? Math.round(performance.now() - shownAt) : "";
  const correct = (current.kind === "go") === spoke;
  let outcome;
  if (current.kind === "go") outcome = spoke ? "hit" : "miss";
  else outcome = spoke ? "false_alarm" : "correct_reject";
  if (correct) {
    score += current.kind === "go" ? SETTINGS.pointsForBanana : SETTINGS.pointsForCoconut;
    message.textContent = current.kind === "go" ? `Banana! ${rt} ms` : "Good, you ignored the coconut.";
    beep(true); flash(true);
  } else {
    lives -= 1; beep(false); flash(false);
    message.textContent = current.kind === "go" ? "Missed the banana!" : "That was a coconut!";
    if (!spoke) lastMissAt = performance.now();
  }
  logRow({ kind: current.kind, depth: current.depth, on_screen_ms: current.onScreen, spoke: spoke ? 1 : 0,
           rt_ms: rt, outcome, correct: correct ? 1 : 0, score });
  if (turn % SETTINGS.turnsPerLevel === 0) { lvl += 1; message.textContent += `  Level ${lvl}!`; }
  updateHud();
  targetKind = null; current = null;
  if (lives <= 0) {
    playing = false;
    message.textContent = `Game over. Score ${score}, level ${lvl}, ${turn} turns. Save your data!`;
    return;
  }
  nextTurn();
}

function saveCsv() {
  if (!data.length) { message.textContent = "Nothing to save yet. Play first."; return; }
  const cols = Object.keys(data[0]);
  const lines = [cols.join(",")].concat(data.map((r) => cols.map((c) => r[c]).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n") + "\n"], { type: "text/csv" }));
  a.download = "game-sonnet.csv"; a.click();
}

// Controls
for (const [id, out] of [["occ", "occV"], ["ill", "illV"], ["size", "sizeV"], ["thr", "thrV"], ["stop", "stopV"]]) {
  const el = document.getElementById(id);
  el.addEventListener("input", () => {
    document.getElementById(out).textContent = el.value;
    if (id === "thr") document.getElementById("thrLine").style.left = el.value + "%";
    if (["occ", "ill", "size"].includes(id) && !current) regenerateJungle();
    if (["ill", "size"].includes(id) && current) { /* applies from next trial */ }
  });
}
document.getElementById("depth").addEventListener("change", () => { if (!current) regenerateJungle(); });
document.getElementById("startBtn").addEventListener("click", (e) => { e.target.blur(); startGame(); });
document.getElementById("saveBtn").addEventListener("click", saveCsv);
document.getElementById("thrLine").style.left = thrEl.value + "%";

regenerateJungle();
requestAnimationFrame(render);
requestAnimationFrame(micLoop);
</script>
</body>
</html>
